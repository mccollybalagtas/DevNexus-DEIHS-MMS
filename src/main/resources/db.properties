google.clientSecret=
google.redirectPort=8765

# Outgoing mail for registration e-mail verification.
# Leave smtp.host blank to use development mode: the 6-digit code is shown
# on the registration form instead of being sent.
# Example (Gmail): smtp.host=smtp.gmail.com, smtp.port=587, smtp.starttls=true,
# smtp.user=you@gmail.com, smtp.password=<app password>, smtp.from=you@gmail.com
smtp.host=
smtp.port=587
smtp.user=
smtp.password=
smtp.from=
smtp.starttls=true
smtp.ssl=false
smtp.auth=true
